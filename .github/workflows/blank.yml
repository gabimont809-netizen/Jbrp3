name: Virtual Roblox PC

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System Information
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "       VIRTUAL ROBLOX PC"
          Write-Host "========================================"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host "$([math]::Round($ram.TotalPhysicalMemory / 1GB, 2)) GB"

      - name: Create PC Folder
        shell: powershell
        run: |
          $folder = "C:\VirtualRobloxPC"

          New-Item `
            -ItemType Directory `
            -Path $folder `
            -Force | Out-Null

          Write-Host "Pasta criada: $folder"

      - name: Configure Performance
        shell: powershell
        run: |
          Write-Host "Configurando desempenho..."

          powercfg /setactive SCHEME_MIN

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name "MenuShowDelay" `
            -Value "0" `
            -ErrorAction SilentlyContinue

          Write-Host "Desempenho configurado."

      - name: Check Network
        shell: powershell
        run: |
          Write-Host "Informações de rede:"
          ipconfig

      - name: Check RDP
        shell: powershell
        run: |
          Write-Host "Verificando RDP..."

          $rdp = Get-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server"

          if ($rdp.fDenyTSConnections -eq 0) {
            Write-Host "RDP está habilitado."
          }
          else {
            Write-Host "RDP não está habilitado neste ambiente."
          }

      - name: Prepare Roblox Environment
        shell: powershell
        run: |
          $folder = "C:\VirtualRobloxPC\Roblox"

          New-Item `
            -ItemType Directory `
            -Path $folder `
            -Force | Out-Null

          Write-Host "Ambiente Roblox preparado."

      - name: Prepare Roblox Studio Environment
        shell: powershell
        run: |
          $folder = "C:\VirtualRobloxPC\RobloxStudio"

          New-Item `
            -ItemType Directory `
            -Path $folder `
            -Force | Out-Null

          Write-Host "Ambiente Roblox Studio preparado."

      - name: Create Configuration
        shell: powershell
        run: |
          $config = @{
            Project = "Virtual Roblox PC"
            Roblox = $true
            RobloxStudio = $true
            RDP = $true
            Tailscale = $true
            PerformanceMode = $true
          }

          $config |
            ConvertTo-Json -Depth 5 |
            Set-Content "C:\VirtualRobloxPC\config.json"

          Write-Host "Configuração criada."

      - name: Final
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       SETUP FINALIZADO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Ambiente preparado para Roblox."
          Write-Host "Ambiente preparado para Roblox Studio."
          Write-Host "RDP verificado."
          Write-Host "Tailscale marcado para configuração."
          Write-Host ""
